  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bankGrad)"/>
  <circle cx="256" cy="256" r="215" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-dasharray="10 6"/>
