  <circle cx="256" cy="270" r="44" fill="#16233F" stroke="url(#goldGrad)" stroke-width="5"/>
  <text x="256" y="286" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="44" font-weight="900" fill="url(#goldGrad)" text-anchor="middle">₹</text>
